<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0a1026" />
      <stop offset="100%" stop-color="#04060f" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="beamCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="1" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="agentDevGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="agentSecGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="agentArchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="agentOpsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="intenseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- CSS Keyframe Animations -->
    <style>
      /* Rotating Central Core */
      @keyframes spinClockwise {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes spinCounter {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }
      /* Flowing Circuit Packets */
      @keyframes packetFlow1 {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes packetFlow2 {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 400; }
      }
      /* Pulsing Working Agents */
      @keyframes agentPulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 6px rgba(0, 242, 254, 0.4)); }
        50% { transform: scale(1.06); filter: drop-shadow(0 0 16px rgba(0, 242, 254, 0.9)); }
      }
      @keyframes agentPulseGreen {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 6px rgba(16, 185, 129, 0.4)); }
        50% { transform: scale(1.06); filter: drop-shadow(0 0 16px rgba(16, 185, 129, 0.9)); }
      }
      @keyframes agentPulseRed {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 6px rgba(239, 68, 68, 0.4)); }
        50% { transform: scale(1.06); filter: drop-shadow(0 0 16px rgba(239, 68, 68, 0.9)); }
      }
      @keyframes agentPulsePink {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 6px rgba(236, 72, 153, 0.4)); }
        50% { transform: scale(1.06); filter: drop-shadow(0 0 16px rgba(236, 72, 153, 0.9)); }
      }
      /* Terminal Typing / Line Scroll */
      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes terminalCycle1 {
        0%, 22% { opacity: 1; transform: translateY(0); }
        25%, 97% { opacity: 0.4; }
        100% { opacity: 1; }
      }
      @keyframes beaconPing {
        0% { r: 5px; opacity: 1; }
        100% { r: 16px; opacity: 0; }
      }
      @keyframes scanSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .core-outer {
        transform-origin: 950px 220px;
        animation: spinClockwise 24s linear infinite;
      }
      .core-inner {
        transform-origin: 950px 220px;
        animation: spinCounter 16s linear infinite;
      }
      .radar-sweep {
        transform-origin: 950px 220px;
        animation: scanSweep 8s linear infinite;
      }
      .agent-node-arch {
        transform-origin: 950px 85px;
        animation: agentPulsePink 3.2s ease-in-out infinite;
      }
      .agent-node-dev {
        transform-origin: 1085px 220px;
        animation: agentPulseGreen 2.8s ease-in-out 0.4s infinite;
      }
      .agent-node-sec {
        transform-origin: 950px 355px;
        animation: agentPulseRed 3.5s ease-in-out 0.8s infinite;
      }
      .agent-node-ops {
        transform-origin: 815px 220px;
        animation: agentPulse 3s ease-in-out 1.2s infinite;
      }
      .data-packet-1 {
        stroke-dasharray: 12 30;
        animation: packetFlow1 4s linear infinite;
      }
      .data-packet-2 {
        stroke-dasharray: 15 35;
        animation: packetFlow2 4.5s linear infinite;
      }
      .terminal-cursor {
        animation: blinkCursor 0.9s infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="440" rx="18" fill="url(#bgGradient)" />

  <!-- Ambient Cyber Grid -->
  <g stroke="#38bdf8" stroke-width="0.6" stroke-opacity="0.12">
    <line x1="0" y1="55" x2="1200" y2="55" />
    <line x1="0" y1="110" x2="1200" y2="110" />
    <line x1="0" y1="165" x2="1200" y2="165" />
    <line x1="0" y1="220" x2="1200" y2="220" />
    <line x1="0" y1="275" x2="1200" y2="275" />
    <line x1="0" y1="330" x2="1200" y2="330" />
    <line x1="0" y1="385" x2="1200" y2="385" />
    <line x1="100" y1="0" x2="100" y2="440" />
    <line x1="220" y1="0" x2="220" y2="440" />
    <line x1="340" y1="0" x2="340" y2="440" />
    <line x1="460" y1="0" x2="460" y2="440" />
    <line x1="580" y1="0" x2="580" y2="440" />
    <line x1="700" y1="0" x2="700" y2="440" />
    <line x1="820" y1="0" x2="820" y2="440" />
    <line x1="940" y1="0" x2="940" y2="440" />
    <line x1="1060" y1="0" x2="1060" y2="440" />
  </g>

  <!-- ======================================================================
       LEFT PANE: IDENTITY, ACTIVE SWARM STATUS & TERMINAL CONSOLE
       ====================================================================== -->

  <!-- Top Active Swarm Pill -->
  <g transform="translate(50, 36)">
    <rect width="280" height="30" rx="15" fill="#0f172a" stroke="#0284c7" stroke-width="1.2" />
    <!-- Animated Ping Beacon -->
    <circle cx="18" cy="15" r="5" fill="#10b981" />
    <circle cx="18" cy="15" r="5" fill="none" stroke="#10b981" stroke-width="1.5">
      <animate attributeName="r" values="5;16" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="34" y="20" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" letter-spacing="1">
      MULTI-AGENT SWARM ACTIVE
    </text>
  </g>

  <!-- Main Hero Title -->
  <text x="50" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="url(#cyanPurple)" letter-spacing="-0.5" filter="url(#subtleGlow)">
    MASTER AI AGENT SKILLS
  </text>

  <!-- Subtitle -->
  <text x="50" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#94a3b8">
    80 Production Engineering Runbooks • 17 Specialized Tracks
  </text>

  <!-- Live Working Agents Terminal Console -->
  <g transform="translate(50, 175)">
    <!-- Terminal Outer Frame -->
    <rect width="640" height="225" rx="12" fill="#090e1d" stroke="#1e293b" stroke-width="1.5" />
    <rect width="640" height="34" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Window Controls -->
    <circle cx="20" cy="17" r="5" fill="#ef4444" />
    <circle cx="36" cy="17" r="5" fill="#f59e0b" />
    <circle cx="52" cy="17" r="5" fill="#10b981" />
    <text x="76" y="21" fill="#64748b" font-family="'JetBrains Mono', monospace, Courier" font-size="11" font-weight="600">agent-orchestrator.swarmlog — live execution</text>

    <!-- Terminal Live Log Stream -->
    <g transform="translate(20, 60)" font-family="'JetBrains Mono', monospace, Courier" font-size="12.5">
      <!-- Line 1: Architect Agent Working -->
      <g>
        <circle cx="0" cy="-4" r="3" fill="#ec4899" />
        <text x="12" y="0" fill="#f472b6" font-weight="700">[Agent-Arch]</text>
        <text x="120" y="0" fill="#cbd5e1">Synthesizing C4 Architecture &amp; ADR-0042</text>
        <text x="475" y="0" fill="#10b981" font-weight="600">[DONE]</text>
      </g>

      <!-- Line 2: Fullstack Dev Agent Working -->
      <g transform="translate(0, 32)">
        <circle cx="0" cy="-4" r="3" fill="#10b981" />
        <text x="12" y="0" fill="#34d399" font-weight="700">[Agent-Fullstack]</text>
        <text x="160" y="0" fill="#cbd5e1">Emitting tRPC v11 router &amp; React Server Components</text>
        <text x="545" y="0" fill="#38bdf8" font-weight="600">[SYNC]</text>
      </g>

      <!-- Line 3: Cyber SecOps Agent Working -->
      <g transform="translate(0, 64)">
        <circle cx="0" cy="-4" r="3" fill="#ef4444" />
        <text x="12" y="0" fill="#f87171" font-weight="700">[Agent-SecOps]</text>
        <text x="135" y="0" fill="#cbd5e1">Scanning OWASP API Top 10 • 0 BOLA flaws</text>
        <text x="495" y="0" fill="#10b981" font-weight="600">[PASS]</text>
      </g>

      <!-- Line 4: SRE / DevOps Agent Working -->
      <g transform="translate(0, 96)">
        <circle cx="0" cy="-4" r="3" fill="#38bdf8" />
        <text x="12" y="0" fill="#60a5fa" font-weight="700">[Agent-DevOps]</text>
        <text x="135" y="0" fill="#cbd5e1">ArgoCD GitOps deployment verified • SLO nominal</text>
        <text x="535" y="0" fill="#10b981" font-weight="600">[OK]</text>
      </g>

      <!-- Line 5: Active Prompt Prompting with Blinking Cursor -->
      <g transform="translate(0, 130)">
        <text x="0" y="0" fill="#38bdf8" font-weight="700">swarm@production:~$</text>
        <text x="180" y="0" fill="#e2e8f0">agents collaborating across 80 skills</text>
        <rect x="500" y="-11" width="8" height="14" fill="#00f2fe" class="terminal-cursor" />
      </g>
    </g>
  </g>

  <!-- ======================================================================
       RIGHT PANE: ANIMATED WORKING AGENTS SWARM & NEURAL CORE
       ====================================================================== -->

  <!-- Circuit Interconnect Tracks (Lines between central core and 4 agents) -->
  <g stroke="#1e293b" stroke-width="2">
    <!-- Center to Top (Arch) -->
    <line x1="950" y1="220" x2="950" y2="85" />
    <!-- Center to Right (Dev) -->
    <line x1="950" y1="220" x2="1085" y2="220" />
    <!-- Center to Bottom (Sec) -->
    <line x1="950" y1="220" x2="950" y2="355" />
    <!-- Center to Left (Ops) -->
    <line x1="950" y1="220" x2="815" y2="220" />
    <!-- Outer Ring Mesh -->
    <polygon points="950,85 1085,220 950,355 815,220" fill="none" stroke="#0ea5e9" stroke-width="1.2" stroke-opacity="0.3" stroke-dasharray="6 6" />
  </g>

  <!-- Animated Data Packets Flowing Along Circuits -->
  <g stroke-width="2.5" fill="none">
    <!-- Center -> Arch -->
    <line x1="950" y1="220" x2="950" y2="85" stroke="#ec4899" class="data-packet-1" />
    <!-- Center -> Dev -->
    <line x1="950" y1="220" x2="1085" y2="220" stroke="#10b981" class="data-packet-2" />
    <!-- Center -> Sec -->
    <line x1="950" y1="220" x2="950" y2="355" stroke="#ef4444" class="data-packet-1" />
    <!-- Center -> Ops -->
    <line x1="950" y1="220" x2="815" y2="220" stroke="#00f2fe" class="data-packet-2" />
    <!-- Ring Packets -->
    <polygon points="950,85 1085,220 950,355 815,220" stroke="url(#cyanPurple)" stroke-width="2" class="data-packet-1" />
  </g>

  <!-- Central Quantum Neural Processor (Center: 950, 220) -->
  <g>
    <!-- Ambient Core Glow -->
    <circle cx="950" cy="220" r="60" fill="#00f2fe" fill-opacity="0.08" filter="url(#intenseGlow)" />
    
    <!-- Outer Spinning Ring -->
    <g class="core-outer">
      <circle cx="950" cy="220" r="50" fill="none" stroke="#00f2fe" stroke-width="2" stroke-dasharray="14 10 30 10" stroke-opacity="0.7" />
      <circle cx="950" cy="220" r="42" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="8 6" stroke-opacity="0.5" />
    </g>

    <!-- Inner Counter-Spinning Ring -->
    <g class="core-inner">
      <circle cx="950" cy="220" r="32" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="20 15" stroke-opacity="0.8" />
    </g>

    <!-- 360 Radar Scan Sweep -->
    <g class="radar-sweep">
      <line x1="950" y1="220" x2="1010" y2="220" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.9" />
    </g>

    <!-- Glowing Core Center -->
    <circle cx="950" cy="220" r="18" fill="#0f172a" stroke="#00f2fe" stroke-width="2.5" filter="url(#subtleGlow)" />
    <text x="950" y="225" text-anchor="middle" font-size="14" fill="#00f2fe">⚡</text>
  </g>

  <!-- ======================================================================
       WORKING AGENT 1: ARCHITECT AGENT (Top: 950, 85)
       ====================================================================== -->
  <g class="agent-node-arch">
    <circle cx="950" cy="85" r="34" fill="#0b1124" stroke="url(#agentArchGrad)" stroke-width="2.5" />
    <circle cx="950" cy="85" r="28" fill="#1e1035" />
    <text x="950" y="92" text-anchor="middle" font-size="18">🧠</text>
    <!-- Label Pill -->
    <g transform="translate(950, 40)">
      <rect x="-60" y="-10" width="120" height="20" rx="10" fill="#0f172a" stroke="#ec4899" stroke-width="1" />
      <text x="0" y="4" text-anchor="middle" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700">ARCHITECT AGENT</text>
    </g>
    <!-- Activity Badge -->
    <circle cx="975" cy="65" r="5" fill="#10b981" />
  </g>

  <!-- ======================================================================
       WORKING AGENT 2: FULL-STACK DEV AGENT (Right: 1085, 220)
       ====================================================================== -->
  <g class="agent-node-dev">
    <circle cx="1085" cy="220" r="34" fill="#0b1124" stroke="url(#agentDevGrad)" stroke-width="2.5" />
    <circle cx="1085" cy="220" r="28" fill="#062e24" />
    <text x="1085" y="227" text-anchor="middle" font-size="18">💻</text>
    <!-- Label Pill -->
    <g transform="translate(1085, 275)">
      <rect x="-60" y="-10" width="120" height="20" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1" />
      <text x="0" y="4" text-anchor="middle" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700">DEV AGENT (v11)</text>
    </g>
    <!-- Activity Badge -->
    <circle cx="1110" cy="200" r="5" fill="#10b981" />
  </g>

  <!-- ======================================================================
       WORKING AGENT 3: CYBER SECOPS AGENT (Bottom: 950, 355)
       ====================================================================== -->
  <g class="agent-node-sec">
    <circle cx="950" cy="355" r="34" fill="#0b1124" stroke="url(#agentSecGrad)" stroke-width="2.5" />
    <circle cx="950" cy="355" r="28" fill="#2d1010" />
    <text x="950" y="362" text-anchor="middle" font-size="18">🛡️</text>
    <!-- Label Pill -->
    <g transform="translate(950, 405)">
      <rect x="-60" y="-10" width="120" height="20" rx="10" fill="#0f172a" stroke="#ef4444" stroke-width="1" />
      <text x="0" y="4" text-anchor="middle" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700">SECOPS AGENT</text>
    </g>
    <!-- Activity Badge -->
    <circle cx="975" cy="335" r="5" fill="#10b981" />
  </g>

  <!-- ======================================================================
       WORKING AGENT 4: DEVOPS & SRE AGENT (Left: 815, 220)
       ====================================================================== -->
  <g class="agent-node-ops">
    <circle cx="815" cy="220" r="34" fill="#0b1124" stroke="url(#agentOpsGrad)" stroke-width="2.5" />
    <circle cx="815" cy="220" r="28" fill="#08203e" />
    <text x="815" y="227" text-anchor="middle" font-size="18">🚀</text>
    <!-- Label Pill -->
    <g transform="translate(815, 275)">
      <rect x="-60" y="-10" width="120" height="20" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
      <text x="0" y="4" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700">SRE &amp; GITOPS</text>
    </g>
    <!-- Activity Badge -->
    <circle cx="840" cy="200" r="5" fill="#10b981" />
  </g>

  <!-- Border Frame Accents -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#cyanPurple)" stroke-width="3" />
  <line x1="0" y1="440" x2="1200" y2="440" stroke="url(#cyanPurple)" stroke-width="2" />
</svg>
